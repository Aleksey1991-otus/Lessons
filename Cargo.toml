[package]
name = "news_telegram_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
log = "0.4.28"
env_logger = "0.11.3"
tokio = { version = "1.48.0", features = ["rt", "macros"] }
reqwest = { version = "0.12.24", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dotenv = "0.15"
once_cell = "1.19.0"